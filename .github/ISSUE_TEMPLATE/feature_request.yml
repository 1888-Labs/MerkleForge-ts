name: Feature request
description: Suggest an API, tree variant, or integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      render: ts
  - type: dropdown
    id: rust
    attributes:
      label: Does the Rust crate already have this?
      options: ['Yes', 'No', 'Not sure']
