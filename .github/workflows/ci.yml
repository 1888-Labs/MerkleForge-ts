name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm coverage

  packages:
    name: Package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # publint and arethetypeswrong check what npm users will actually install.
      - run: pnpm check:packages
      - name: Smoke-test the built packages from plain Node
        working-directory: packages/merkle-variants
        run: |
          node --input-type=module -e "
          import { utf8 } from '@merkleforge/core'
          import { Keccak256 } from '@merkleforge/hash'
          import { BinaryMerkleTree } from '@merkleforge/variants'
          const tree = BinaryMerkleTree.fromLeaves(Keccak256, ['a', 'b', 'c'].map(utf8))
          if (!BinaryMerkleTree.verify(Keccak256, tree.root(), utf8('b'), tree.generateProof(1))) process.exit(1)
          "

  browsers:
    name: Test (browsers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # The whole Vitest suite, in Chromium, Firefox, and WebKit.
      - run: pnpm test:browser

  runtimes:
    name: Runtime (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, deno, bun]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      # Loads the built packages (what npm users get) and checks roots against
      # the Rust vectors, WASM against pure JS, and a mainnet eth_getProof.
      - if: matrix.runtime == 'node'
        run: node test/runtime/check.mjs
      - if: matrix.runtime == 'deno'
        run: deno run --allow-read --allow-env test/runtime/check.mjs
      - if: matrix.runtime == 'bun'
        run: bun test/runtime/check.mjs

  generated:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # rustup reads the toolchain and wasm32 target from scripts/wasm-hash/rust-toolchain.toml.
      - run: pnpm build:wasm
      - run: node scripts/gen-keccak.mjs && pnpm exec biome format --write packages/merkle-hash/src/keccak-f1600.ts
      - run: git diff --exit-code packages/merkle-hash-wasm/src/wasm-module.ts packages/merkle-hash/src/keccak-f1600.ts

  parity:
    name: Byte-for-byte parity (OpenZeppelin, Rust, noble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The released Rust crates (main), where scripts/rust-vectors expects them.
      - run: git clone --depth 1 --branch main https://github.com/1888-Labs/MerkleForge.git ../MerkleForge
      # Only the libraries parity.mjs compares against, not bench/'s full (1 GB+) dependency set.
      - run: |
          npm install --prefix "$RUNNER_TEMP/parity" @openzeppelin/merkle-tree@1.0.8 @noble/hashes@2.4.0
          ln -s "$RUNNER_TEMP/parity/node_modules" bench/node_modules
      # rustup reads the toolchain from scripts/rust-vectors/rust-toolchain.toml.
      - run: node bench/parity.mjs >> "$GITHUB_STEP_SUMMARY"

  solidity:
    name: Solidity verifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      # Fixtures come from the TypeScript packages, so the contracts are checked against them.
      - run: pnpm fixtures:solidity
      - name: Fixtures are up to date
        run: git diff --exit-code contracts/test/fixtures
      - run: forge fmt --check
        working-directory: contracts
      - run: forge test --gas-report
        working-directory: contracts

  changeset:
    name: Changeset present
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Warns only: docs, CI, and test-only PRs do not need a changeset.
      - run: pnpm changeset status --since=origin/${{ github.base_ref }} || echo "::warning::No changeset found. Run 'pnpm changeset' if this PR changes a published package."
