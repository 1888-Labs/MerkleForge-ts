name: Release

# main: stable releases. Pending changesets open a "Version packages" PR;
# merging it stages the packages for npm under `latest` and creates the vX.Y.Z release.
# develop: staging. Pending changesets stage X.Y.Z-next.YYYY-MM-DD-HHMM (UTC) snapshots
# under the `next` dist-tag and create a GitHub prerelease.
# Both stage through npm trusted publishing (OIDC, `id-token: write`); there is no npm token.
# Each package's trusted publisher is 1888-Labs/MerkleForge-ts, workflow release.yml, stage only:
# a staged version goes live once a maintainer approves it with 2FA (`npm stage approve` or
# the Staged Packages tab on npmjs.com).
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version or publish
    if: github.repository == '1888-Labs/MerkleForge-ts' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache in release builds (cache poisoning).
          package-manager-cache: false
      # `npm stage publish` needs npm 11.15+; Node 24 bundles an older npm.
      - run: npm install -g npm@12.2.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:packages
      - id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
          # One vX.Y.Z release for the whole fixed group, made below,
          # instead of a tag and release per package.
          create-github-releases: false
          push-git-tags: false
        env:
          GH_TOKEN: ${{ github.token }}
      # The publish script only runs when no changesets are pending. The script
      # skips versions that already have a release.
      - if: steps.changesets.outputs.has-changesets == 'false'
        run: node scripts/github-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  sync-develop:
    name: Fast-forward develop
    needs: release
    if: always() && github.repository == '1888-Labs/MerkleForge-ts' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Keep develop level with main after each release.
      - run: |
          git fetch origin develop
          if git merge-base --is-ancestor origin/develop HEAD; then
            git push origin HEAD:develop
          else
            echo "::notice::develop has commits that main does not; merge main into develop by hand."
          fi

  staging:
    name: Publish next snapshot
    if: github.repository == '1888-Labs/MerkleForge-ts' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - id: pending
        run: |
          if ls .changeset/*.md >/dev/null 2>&1; then echo "changesets=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.pending.outputs.changesets == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.pending.outputs.changesets == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache in release builds (cache poisoning).
          package-manager-cache: false
      # `npm stage publish` needs npm 11.15+; Node 24 bundles an older npm.
      - if: steps.pending.outputs.changesets == 'true'
        run: npm install -g npm@12.2.1
      - if: steps.pending.outputs.changesets == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.pending.outputs.changesets == 'true'
        run: pnpm check
      - if: steps.pending.outputs.changesets == 'true'
        run: |
          # One segment, so a time like 0905 is not a numeric identifier with a leading zero.
          pnpm changeset version --snapshot "next.$(date -u +%Y-%m-%d-%H%M)"
          pnpm build
          node scripts/stage-publish.mjs --tag next
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.pending.outputs.changesets == 'true'
        run: node scripts/github-release.mjs --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
