# Keccak-256 and SHA-256 for @merkleforge/hash-wasm. Build with build.mjs,
# which compiles to wasm32 and writes packages/merkle-hash-wasm/src/wasm.ts.
[package]
name = "merkleforge-wasm-hash"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true

[workspace]
